services:
  gps:
    image: darius0x309/gps-nav-sim:nav-sim
    container_name: gps
    command: ["/usr/local/bin/gps_node", "--sub-addr", "tcp://0.0.0.0:8080", "--pub-addr", "tcp://0.0.0.0:8081"]
    ports:
      - "8081:8081" #<host port>:<container port>

  telemetry:
    image: darius0x309/gps-nav-sim:nav-tm
    container_name: telemetry
    command:  ["python", "-u", "tm_writer.py", "-s", "tcp://gps:8081", "-e", ".txt"]
    depends_on:
      - gps
    volumes:
      - ./sim_data/logs:/app/sim_data/logs

  sat1:
    image: darius0x309/gps-nav-sim:nav-sim
    container_name: sat1
    command: ["/usr/local/bin/sat_node", "--id", "1", "--phase-angle", "0.0", "--pub-addr", "tcp://gps:8080"]
    depends_on:
      - gps

  sat2:
    image: darius0x309/gps-nav-sim:nav-sim
    container_name: sat2
    command: ["/usr/local/bin/sat_node", "--id", "2", "--phase-angle", "30.0", "--pub-addr", "tcp://gps:8080"]
    depends_on:
      - gps

  sat3:
    image: darius0x309/gps-nav-sim:nav-sim
    container_name: sat3
    command: ["/usr/local/bin/sat_node", "--id", "3", "--phase-angle", "60.0", "--pub-addr", "tcp://gps:8080"]
    depends_on:
      - gps

  vehicle:
    image: darius0x309/gps-nav-sim:nav-sim
    container_name: vehicle
    command: ["/usr/local/bin/vehicle_node", "--velocity", "35.0", "--efficiency", "7.0", "--fuel", "55.0", "--pub-addr", "tcp://gps:8080"]
    depends_on:
      - gps